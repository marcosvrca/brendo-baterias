name: Unstick Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  pages: write
  deployments: write

jobs:
  unstick:
    runs-on: ubuntu-latest
    steps:
      - name: Release stuck GitHub Pages deployments
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            try {
              const listed = await github.request("GET /repos/{owner}/{repo}/pages/deployments", { owner, repo });
              const deployments = Array.isArray(listed.data) ? listed.data : [];
              core.warning(`pages deployments: ${JSON.stringify(deployments).slice(0, 600)}`);
              for (const deployment of deployments) {
                const status = deployment.status || "";
                if (!(status.includes("progress") || status === "queued" || status === "pending")) continue;
                await github.request("POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel", {
                  owner,
                  repo,
                  pages_deployment_id: deployment.id,
                });
                core.warning(`cancelled ${deployment.id}`);
              }
            } catch (error) {
              const body = error.response?.data ? JSON.stringify(error.response.data) : "";
              core.setFailed(`pages api ${error.status} ${error.message} ${body}`.slice(0, 700));
            }
