name: Unstick Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  pages: write
  deployments: write

jobs:
  unstick:
    runs-on: ubuntu-latest
    steps:
      - name: Release stuck GitHub Pages deployments
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const listed = await github.rest.repos.listDeployments({
              owner,
              repo,
              environment: "github-pages",
              per_page: 20,
            });
            for (const deployment of listed.data) {
              const statuses = await github.rest.repos.listDeploymentStatuses({
                owner,
                repo,
                deployment_id: deployment.id,
                per_page: 1,
              });
              const state = statuses.data[0]?.state || "none";
              core.info(`${deployment.id} ${deployment.sha.slice(0, 7)} ${state}`);
              if (state === "success" || state === "inactive") continue;
              try {
                await github.request("POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel", {
                  owner,
                  repo,
                  pages_deployment_id: deployment.id,
                });
                core.info(`cancelled pages deployment ${deployment.id}`);
              } catch (error) {
                core.warning(`cancel ${deployment.id}: ${error.status} ${error.message}`);
              }
              await github.rest.repos.createDeploymentStatus({
                owner,
                repo,
                deployment_id: deployment.id,
                state: "inactive",
                description: "Release stuck Pages deployment",
              });
              core.info(`marked inactive ${deployment.id}`);
            }
